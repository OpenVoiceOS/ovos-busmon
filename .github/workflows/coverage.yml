name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@82252c363b239fe5c60dc0ae2a4e81721d4cabef
    with:
      python_version: '3.11'
      coverage_source: 'ovos_busmon'
      test_path: 'tests/'
      install_extras: 'dev'
      min_coverage: 0
