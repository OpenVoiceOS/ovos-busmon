name: Deploy static UI to GitHub Pages
on:
  push:
    branches: [dev]
    paths: ['static/**']
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # Enable once the repository is public: remove the `if: false` line and
    # turn on Pages (Settings → Pages → GitHub Actions source).
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
