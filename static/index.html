<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%8C%3C/text%3E%3C/svg%3E">
<title>OVOS Messagebus Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #222; color: #fff; padding: 1em; margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 1rem; background-color: #222; border-radius: 8px; margin-bottom: 1rem;
    }
    .header img { height: 40px; }
    .header h1 { color: #f44336; margin: 0; font-size: 1.2rem; }
    .transport-badge {
      font-size: 0.75rem; padding: 3px 8px; border-radius: 10px;
      background: #444; color: #aaa; margin-left: 8px; vertical-align: middle;
    }
    .transport-badge.ws  { background: #1a3a1a; color: #4caf50; }
    .transport-badge.sse { background: #1a2a3a; color: #2196f3; }
    .transport-badge.err { background: #3a1a1a; color: #f44336; }

    .controls { margin-top: 1rem; text-align: center; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; margin-bottom: 0.4rem; }
    .input, select {
      background: #444; color: #fff; border: 1px solid #666; border-radius: 4px;
      padding: 8px 12px; font-size: 0.9em; min-width: 160px; flex: 1 1 160px; max-width: 240px;
    }
    .input:focus, select:focus { outline: none; box-shadow: 0 0 4px #f44336; }
    .btn {
      padding: 0.6rem 1rem; cursor: pointer; border: none; border-radius: 4px;
      background-color: #333; color: white; font-weight: bold; margin: 0.2rem;
    }
    .btn:hover { background-color: #7a1f1f; }
    .btn.danger { background-color: #5a1010; }
    .btn.pause-active { background-color: #7a6010; }

    /* Connection config panel */
    .config-panel {
      background: #2a2a2a; border: 1px solid #555; border-radius: 8px;
      padding: 0.8rem 1rem; margin-bottom: 0.8rem; text-align: left;
    }
    .config-panel summary { cursor: pointer; color: #aaa; font-size: 0.9rem; }
    .config-panel .row { justify-content: flex-start; margin-top: 0.5rem; }
    .config-panel label { color: #aaa; font-size: 0.85rem; margin-right: 4px; }

    /* Inject panel */
    .inject-panel {
      background: #2a2a2a; border: 1px solid #555; border-radius: 8px;
      padding: 0.8rem 1rem; margin-bottom: 0.8rem; text-align: left;
    }
    .inject-panel summary { cursor: pointer; color: #aaa; font-size: 0.9rem; }
    .inject-panel textarea {
      background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;
      padding: 8px; font-family: monospace; font-size: 0.85rem;
      width: 100%; min-height: 80px; resize: vertical; margin-top: 0.4rem;
    }
    .inject-status { font-size: 0.85rem; margin-top: 4px; }

    .msg {
      border: 1px solid #555; padding: 0.8rem; margin-bottom: 0.8rem;
      background: #333; border-radius: 8px; cursor: pointer;
    }
    .msg-type { color: #f44336; font-weight: bold; }
    .label { color: #bbb; }
    .msg-details { display: none; padding-top: 0.8rem; }
    .msg-section { margin-top: 0.8rem; }
    .msg-section pre { margin-top: 0.5rem; padding: 10px; background: #444; border-radius: 5px; color: #f8f8f2; overflow: auto; }
    /* Minimal vendored JSON highlighter — no CDN, works fully offline. */
    .jh-key    { color: #66d9ef; }
    .jh-string { color: #a6e22e; }
    .jh-number { color: #ae81ff; }
    .jh-bool   { color: #fd971f; }
    .jh-null   { color: #f92672; }
    .jh-punct  { color: #ccc; }
    .msg-section button {
      margin-top: 0.3rem; padding: 0.3rem 0.6rem; font-size: 0.85em;
      background-color: #444; color: #fff; border: 1px solid #666; border-radius: 4px; cursor: pointer;
    }
    .msg-section button:hover { background-color: #555; }

    .status-bar { font-size: 0.8rem; color: #888; text-align: right; margin-bottom: 4px; }

    /* Chat panel */
    .layout { display: flex; gap: 1rem; align-items: flex-start; }
    .layout .container { flex: 1 1 auto; min-width: 0; }
    .chat-panel {
      flex: 0 0 320px; max-width: 320px; display: none;
      background: #2a2a2a; border: 1px solid #555; border-radius: 8px;
      padding: 0.8rem; position: sticky; top: 0.5rem;
    }
    .chat-panel.open { display: flex; flex-direction: column; }
    .chat-panel h2 { margin: 0 0 0.5rem 0; font-size: 1rem; color: #f44336; }
    .chat-hint { font-size: 0.75rem; color: #888; margin-bottom: 0.5rem; }
    .chat-log {
      flex: 1 1 auto; min-height: 200px; max-height: 60vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.5rem;
    }
    .chat-bubble {
      padding: 0.5rem 0.7rem; border-radius: 10px; font-size: 0.88rem; max-width: 90%;
      word-wrap: break-word; white-space: pre-wrap;
    }
    .chat-bubble.me    { align-self: flex-end;   background: #f44336; color: #fff; }
    .chat-bubble.assistant { align-self: flex-start; background: #444; color: #eee; }
    .chat-bubble.error { align-self: flex-start; background: #5a1010; color: #f88; }
    .chat-input-row { display: flex; gap: 0.4rem; }
    .chat-input-row input {
      flex: 1 1 auto; background: #444; color: #fff; border: 1px solid #666;
      border-radius: 4px; padding: 6px 10px; font-size: 0.9em;
    }
    .chat-session-id { font-family: monospace; font-size: 0.7rem; color: #666; margin-top: 0.4rem; }

    /* Timeline view */
    .trace {
      border: 1px solid #555; border-radius: 8px; margin-bottom: 0.8rem; background: #2c2c2c;
    }
    .trace > summary {
      cursor: pointer; padding: 0.7rem 0.9rem; list-style: none;
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .trace > summary::-webkit-details-marker { display: none; }
    .trace > summary::before { content: '▶'; color: #888; font-size: 0.75em; }
    .trace[open] > summary::before { content: '▼'; }
    .trace-session { color: #f44336; font-weight: bold; font-family: monospace; }
    .trace-summary { color: #ccc; flex: 1 1 auto; }
    .trace-count { color: #888; font-size: 0.8em; }
    .trace-body { padding: 0 0.9rem 0.7rem 0.9rem; }
    .trace-step {
      display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.35rem 0;
      border-top: 1px solid #3a3a3a;
    }
    .trace-step:first-child { border-top: none; }
    .badge {
      display: inline-block; min-width: 70px; text-align: center; font-size: 0.7rem;
      font-weight: bold; padding: 2px 6px; border-radius: 10px; color: #fff; flex-shrink: 0;
    }
    .badge.utterance { background: #2e7d32; }
    .badge.pipeline   { background: #1565c0; }
    .badge.skill      { background: #6a1b9a; }
    .badge.output     { background: #ef6c00; }
    .badge.other      { background: #555; }
    .trace-step .msg { flex: 1 1 auto; margin-bottom: 0; }
    footer { margin-top: 1rem; background-color: #222; padding: 1rem; border-radius: 8px; text-align: center; }
    footer p { color: #fff; margin: 0; }
  </style>
</head>

<!-- Connection Config (Mode 1 only — hidden when served by FastAPI) -->
<details class="config-panel" id="ws-config-panel">
  <summary>Direct WebSocket connection settings</summary>
  <div class="row">
    <label>Host: <input type="text" id="ws-host" class="input" value="localhost" style="width:140px;flex:none;"></label>
    <label>Port: <input type="number" id="ws-port" class="input" value="8181" style="width:90px;flex:none;"></label>
    <label>Path: <input type="text" id="ws-path" class="input" value="/core" style="width:100px;flex:none;"></label>
    <button class="btn" onclick="reconnectWS()">Connect</button>
  </div>
</details>

<div class="controls">
  <div class="row">
    <input type="text" id="filter"        class="input" placeholder="Filter by type (glob, e.g. ovos.*)">
    <input type="text" id="search"        class="input" placeholder="Search content">
    <input type="text" id="session_filter" class="input" placeholder="Filter by session_id">
    <input type="text" id="source_filter" class="input" placeholder="Filter by source">
    <input type="text" id="dest_filter"   class="input" placeholder="Filter by destination">
    <select id="sort" class="input">
      <option value="desc">Newest First</option>
      <option value="asc">Oldest First</option>
    </select>
  </div>
  <div>
    <button class="btn" id="view-btn" onclick="toggleView()">🗂 Timeline view</button>
    <button class="btn" id="chat-btn" onclick="toggleChat()">💬 Chat</button>
    <button class="btn" id="pause-btn" onclick="togglePause()">⏸ Pause</button>
    <button class="btn" onclick="clearBuffer()">🗑 Clear</button>
    <button class="btn" onclick="exportJSONL()">⬇ Export JSONL</button>
    <button class="btn" onclick="exportJSON()">⬇ Export JSON</button>
    <button class="btn" onclick="downloadStandalone()" title="Save this page as a local HTML file — use it when the browser blocks ws:// connections from https pages">⬇ Standalone HTML</button>
  </div>
  <div class="row" style="margin-top:0.4rem;">
    <label style="color:#aaa;font-size:0.85rem;align-self:center;">
      Buffer size:
      <input type="number" id="buffer-size" class="input" value="5000" min="100" step="100"
             style="width:100px;flex:none;display:inline-block;" title="Max messages kept client-side; oldest are dropped">
    </label>
    <label style="color:#aaa;font-size:0.85rem;align-self:center;">
      <input type="checkbox" id="pause-on-match"> Pause on filter match
    </label>
  </div>
</div>

<!-- Inject panel -->
<details class="inject-panel">
  <summary>Inject message onto the bus (power tool — use with care)</summary>
  <div class="row" style="margin-top:0.5rem;">
    <input type="text" id="inject-type" class="input" placeholder="Message type (e.g. speak)" style="flex:0 1 240px;">
    <label style="color:#aaa;font-size:0.85rem;align-self:center;">Payload JSON (data):</label>
  </div>
  <textarea id="inject-payload">{}</textarea>
  <div class="row" style="margin-top:0.5rem;">
    <label style="color:#aaa;font-size:0.85rem;align-self:center;">Context JSON (optional):</label>
  </div>
  <textarea id="inject-context">{}</textarea>
  <div>
    <button class="btn danger" onclick="injectMessage()">⚡ Send message</button>
    <span id="inject-status" class="inject-status"></span>
  </div>
</details>

<div class="layout">
  <div class="container">
    <div class="status-bar" id="status-bar">No messages yet.</div>
    <div id="log"></div>
  </div>

  <!-- Chat panel: converse with the assistant over one stable Session. -->
  <div class="chat-panel" id="chat-panel">
    <h2>💬 Chat</h2>
    <div class="chat-hint">Requires service mode (SSE) — sends via the authenticated <code>/api/chat</code> endpoint.</div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Type a message…" autocomplete="off">
      <button class="btn" onclick="sendChat()">Send</button>
    </div>
    <div class="chat-session-id">session: <span id="chat-session-id-label"></span></div>
  </div>
</div>

<footer>
  <p>&copy; 2025 TigreGóticoLda.</p>
  <button class="btn" onclick="window.open('https://github.com/TigreGotico/ovos-busmon/issues','_blank')">Report Issue</button>
</footer>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const DEFAULT_MAX_BUFFER = 5000;
let messages = [];
let paused = false;
let nextId = 0;
let viewMode = 'flat'; // 'flat' | 'timeline'
let droppedCount = 0;

// Tiny vendored JSON syntax highlighter (regex tokenizer over
// JSON.stringify output) — replaces the Prism.js CDN dependency so the UI
// works fully offline. highlightAllJSON() is a no-op kept for readability
// at call sites: highlighting happens inline while building each <pre> via
// highlightJSON(), not as a DOM post-pass.
function highlightAllJSON() { /* no-op: highlighting is applied inline */ }

function highlightJSON(obj) {
  const json = JSON.stringify(obj, null, 2);
  // Tokenize the RAW json first (quotes intact), then HTML-escape each
  // piece individually — safe against '<'/'>'/'&' inside string values.
  const tokenRe = /("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = tokenRe.exec(json)) !== null) {
    out += esc(json.slice(last, m.index));
    const match = m[0];
    const isKey = !!m[2];
    let cls = 'jh-number';
    if (isKey) cls = 'jh-key';
    else if (match.startsWith('"')) cls = 'jh-string';
    else if (match === 'true' || match === 'false') cls = 'jh-bool';
    else if (match === 'null') cls = 'jh-null';
    out += `<span class="${cls}">${esc(match)}</span>`;
    last = tokenRe.lastIndex;
  }
  out += esc(json.slice(last));
  return out;
}

function maxBuffer() {
  const v = parseInt(document.getElementById('buffer-size').value, 10);
  return (Number.isFinite(v) && v > 0) ? v : DEFAULT_MAX_BUFFER;
}

// ─── Transport abstraction ────────────────────────────────────────────────────
/**
 * Two transport modes:
 *
 * MODE 1 (directWS): page loaded as a static file or via GitHub Pages.
 *   Opens a WebSocket directly to the OVOS bus.
 *   Config: ws-host / ws-port / ws-path inputs (also ?host=&port=&path= query params).
 *   Received frames are raw bus JSON (type/data/context).
 *
 * MODE 2 (serviceSSE): page served from the FastAPI app (same origin).
 *   Uses SSE /api/stream for live tail + GET /api/messages for backfill.
 *   The UI sends inject requests to POST /api/send.
 *   Detected by: window.location.protocol === 'http:' (or https:) AND
 *                window.location.hostname !== '' (not file://)
 *                AND the page origin matches the API.
 */

// Transport detection: probe the service API instead of guessing from the URL —
// a GitHub-Pages-hosted copy of this page is also https+hostname but has no
// /api endpoints, so only a live /api/status answer selects service mode.
let transportMode = 'ws';

async function detectTransport() {
  try {
    const r = await fetch('api/status', {signal: AbortSignal.timeout(1500)});
    if (r.ok) return 'sse';
  } catch (e) { /* no service behind this origin */ }
  return 'ws';
}

const badge = document.getElementById('transport-badge');
const wsConfigPanel = document.getElementById('ws-config-panel');

function setBadge(mode, text) {
  badge.textContent = text;
  badge.className = 'transport-badge ' + mode;
}

// ─── MODE 2: SSE transport ────────────────────────────────────────────────────
let _sseLastId = 0;
let _sseSource = null;

function startSSE() {
  wsConfigPanel.style.display = 'none';
  setBadge('sse', 'SSE (service)');

  // Backfill from ring buffer
  fetch('api/messages?since_id=0&limit=500')
    .then(r => r.json())
    .then(msgs => {
      msgs.forEach(m => pushMessage(normaliseServiceMsg(m)));
      _sseLastId = msgs.length ? msgs[msgs.length - 1].id : 0;
      connectSSE();
    })
    .catch(() => connectSSE());
}

function connectSSE() {
  if (_sseSource) _sseSource.close();
  _sseSource = new EventSource('api/stream');
  _sseSource.onopen  = () => setBadge('sse', 'SSE (service)');
  _sseSource.onerror = () => setBadge('err', 'SSE error — reconnecting…');
  _sseSource.addEventListener('message', e => {
    const msg = JSON.parse(e.data);
    pushMessage(normaliseServiceMsg(msg));
  });
}

function normaliseServiceMsg(m) {
  // Service already returns the rich dict
  return m;
}

// ─── MODE 1: Direct WebSocket transport ──────────────────────────────────────
let _ws = null;

function wsUrl() {
  const params = new URLSearchParams(window.location.search);
  const host = params.get('host') || document.getElementById('ws-host').value || 'localhost';
  const port = params.get('port') || document.getElementById('ws-port').value || '8181';
  const path = params.get('path') || document.getElementById('ws-path').value || '/core';
  document.getElementById('ws-host').value = host;
  document.getElementById('ws-port').value = port;
  document.getElementById('ws-path').value = path;
  return `ws://${host}:${port}${path}`;
}

function startDirectWS() {
  wsConfigPanel.style.display = '';
  connectWS();
}

function connectWS() {
  if (_ws) { try { _ws.close(); } catch(e) {} }
  const url = wsUrl();
  setBadge('', 'connecting to ' + url + '…');
  _ws = new WebSocket(url);
  _ws.onopen  = () => setBadge('ws', 'WS → ' + url);
  _ws.onerror = () => setBadge('err', 'WS error');
  _ws.onclose = () => { setBadge('err', 'WS closed — reconnecting in 3s…'); setTimeout(connectWS, 3000); };
  _ws.onmessage = e => {
    try {
      const raw = JSON.parse(e.data);
      pushMessage(normaliseBusFrame(raw));
    } catch(ex) { /* ignore malformed */ }
  };
}

function reconnectWS() { connectWS(); }

function normaliseBusFrame(raw) {
  // Raw bus frame: {type, data, context}
  const ctx = raw.context || {};
  return {
    id: ++nextId,
    timestamp: ctx.timestamp || new Date().toISOString(),
    type: raw.type || raw.msg_type || '?',
    data: raw.data || {},
    context: ctx,
    session: ctx.session_id || null,
    source: ctx.source || null,
    destination: Array.isArray(ctx.destination)
      ? ctx.destination.join(',')
      : (ctx.destination || null),
    session_data: {},
  };
}

// ─── Inject ───────────────────────────────────────────────────────────────────
async function injectMessage() {
  const msgType = document.getElementById('inject-type').value.trim();
  const payloadStr = document.getElementById('inject-payload').value.trim();
  const contextStr = document.getElementById('inject-context').value.trim();
  const status = document.getElementById('inject-status');
  if (!msgType) { status.textContent = '✗ message type is required'; status.style.color='#f44'; return; }

  let payload, context;
  try { payload = JSON.parse(payloadStr || '{}'); }
  catch(e) { status.textContent = '✗ invalid data JSON: ' + e.message; status.style.color='#f44'; return; }
  try { context = JSON.parse(contextStr || '{}'); }
  catch(e) { status.textContent = '✗ invalid context JSON: ' + e.message; status.style.color='#f44'; return; }

  if (transportMode === 'sse') {
    // Mode 2 — POST to API. The service's own bus listener rebroadcasts
    // whatever it emits, so the sent message reappears in the live stream
    // like any other — no special-casing needed here.
    const resp = await fetch('api/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: msgType, data: payload, context: context}),
    });
    if (resp.ok) { status.textContent = '✓ sent'; status.style.color='#4f4'; }
    else { status.textContent = '✗ ' + await resp.text(); status.style.color='#f44'; }
  } else {
    // Mode 1 — send directly on the WebSocket
    if (!_ws || _ws.readyState !== WebSocket.OPEN) {
      status.textContent = '✗ WebSocket not connected'; status.style.color='#f44'; return;
    }
    _ws.send(JSON.stringify({type: msgType, data: payload, context: context}));
    status.textContent = '✓ sent'; status.style.color='#4f4';
  }
  setTimeout(() => status.textContent = '', 3000);
}

// ─── Render ───────────────────────────────────────────────────────────────────
function globMatch(text, pattern) {
  if (!pattern || pattern === '*') return true;
  // Convert glob to regex
  const re = new RegExp('^' + pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$', 'i');
  return re.test(text);
}

function matchesSearch(msg, text) {
  if (!text) return true;
  text = text.toLowerCase();
  return JSON.stringify(msg).toLowerCase().includes(text);
}

function filteredMessages() {
  const fType   = document.getElementById('filter').value.trim();
  const fSearch = document.getElementById('search').value.trim();
  const fSess   = document.getElementById('session_filter').value.trim().toLowerCase();
  const fSrc    = document.getElementById('source_filter').value.trim().toLowerCase();
  const fDst    = document.getElementById('dest_filter').value.trim().toLowerCase();

  return messages.filter(m =>
    globMatch(m.type, fType) &&
    matchesSearch(m, fSearch) &&
    (!fSess || String(m.session||'').toLowerCase().includes(fSess)) &&
    (!fSrc  || String(m.source||'').toLowerCase().includes(fSrc)) &&
    (!fDst  || String(m.destination||'').toLowerCase().includes(fDst))
  );
}

// ─── Timeline grouping (Feature: utterance timeline view) ─────────────────────
// Pure client-side clustering over the existing flat stream — no server
// changes needed. One "trace" == one session id (falling back to the
// utterance-correlation id found in context when present), so one
// interaction (utterance → pipeline/intent → skill handler → speak/audio)
// renders as a single collapsible group.

function classifyMessage(msg) {
  const t = (msg.type || '').toLowerCase();
  if (t === 'recognizer_loop:utterance') return 'utterance';
  if (t.includes('speak') || t.includes('audio') || t.includes('tts')) return 'output';
  if (t.includes('intent') || t.startsWith('ovos.pipeline') || t.includes('padatious') ||
      t.includes('adapt') || t.includes('common_query')) return 'pipeline';
  if (t.startsWith('skill') || t.includes('.activate') || t.includes('mycroft.skill') ||
      t.includes('handler')) return 'skill';
  return 'other';
}

function correlationKey(msg) {
  // Prefer an explicit utterance-correlation id carried in context, then
  // session id, then bucket everything else together.
  const ctx = msg.context || {};
  return ctx.ident || ctx.utterance_id || msg.session || '__ungrouped__';
}

function groupIntoTraces(msgs) {
  const order = [];
  const groups = new Map();
  for (const m of msgs) {
    const key = correlationKey(m);
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(m);
  }
  return order.map(key => {
    const group = groups.get(key);
    const first = group[0];
    const utterance = group.find(m => classifyMessage(m) === 'utterance');
    let summary;
    if (key === '__ungrouped__') summary = '(no session) — misc traffic';
    else if (utterance) summary = (utterance.data && utterance.data.utterances || [utterance.data && utterance.data.utterance])[0] || first.type;
    else summary = first.type;
    return {key, group, summary};
  });
}

function renderTimeline(msgs) {
  const log = document.getElementById('log');
  const traces = groupIntoTraces(msgs);
  log.innerHTML = '';
  for (const {key, group, summary} of traces) {
    const details = document.createElement('details');
    details.className = 'trace';
    const first = group[0];
    const last = group[group.length - 1];
    details.innerHTML = `
      <summary>
        <span class="trace-session">${key === '__ungrouped__' ? 'ungrouped' : esc(key)}</span>
        <span class="trace-summary">${esc(String(summary))}</span>
        <span class="trace-count">${group.length} msg${group.length === 1 ? '' : 's'} · ${esc(new Date(first.timestamp).toLocaleTimeString())}–${esc(new Date(last.timestamp).toLocaleTimeString())}</span>
      </summary>
      <div class="trace-body"></div>
    `;
    const body = details.querySelector('.trace-body');
    for (const msg of group) {
      const step = document.createElement('div');
      step.className = 'trace-step';
      const cat = classifyMessage(msg);
      step.innerHTML = `<span class="badge ${cat}">${cat}</span>${renderMsgHtml(msg)}`;
      body.appendChild(step);
    }
    log.appendChild(details);
  }
  highlightAllJSON();
}

function renderMsgHtml(msg) {
  const ts = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : '';
  let sections = '';
  if (Object.keys(msg.data || {}).length) {
    sections += msgSection(`data-${msg.id}`, 'message.data', msg.data);
  }
  if (Object.keys(msg.context || {}).length) {
    sections += msgSection(`ctx-${msg.id}`, 'message.context', msg.context);
  }
  if (Object.keys(msg.session_data || {}).length) {
    sections += msgSection(`sess-${msg.id}`, 'session', msg.session_data);
  }
  return `
    <div class="msg">
      <div class="msg-type">${esc(msg.type)}</div>
      <div><span class="label">Timestamp:</span> ${esc(ts)}</div>
      <div>
        ${msg.session     ? `<span class="label">session_id:</span> ${esc(msg.session)} ` : ''}
        ${msg.source      ? `<span class="label">| source:</span> ${esc(msg.source)} ` : ''}
        ${msg.destination ? `<span class="label">| destination:</span> ${esc(msg.destination)}` : ''}
      </div>
      ${sections}
    </div>
  `;
}

function toggleView() {
  viewMode = viewMode === 'flat' ? 'timeline' : 'flat';
  const btn = document.getElementById('view-btn');
  btn.textContent = viewMode === 'timeline' ? '📄 Flat view' : '🗂 Timeline view';
  btn.classList.toggle('pause-active', viewMode === 'timeline');
  render();
}

function render() {
  const log  = document.getElementById('log');
  const sort = document.getElementById('sort').value;
  const msgs = filteredMessages();
  const ordered = sort === 'asc' ? [...msgs] : [...msgs].reverse();

  document.getElementById('status-bar').textContent =
    `${messages.length} captured, ${msgs.length} visible` +
    (droppedCount ? ` (${droppedCount} dropped)` : '') +
    (paused ? ' — PAUSED' : '');

  if (viewMode === 'timeline') {
    // Timeline groups read chronologically regardless of the sort toggle.
    renderTimeline([...msgs]);
    return;
  }

  log.innerHTML = '';
  for (const msg of ordered) {
    const div = document.createElement('div');
    div.innerHTML = renderMsgHtml(msg).trim();
    log.appendChild(div.firstElementChild);
  }
  highlightAllJSON();
}

function msgSection(id, label, obj) {
  return `<div class="msg-section">
    <button onclick="toggleVis('${id}')">▶ ${label}</button>
    <div id="${id}" class="msg-details" style="display:none;">
      <pre>${highlightJSON(obj)}</pre>
    </div>
  </div>`;
}

function toggleVis(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Buffer management ────────────────────────────────────────────────────────
// Bounded ring buffer: capped at maxBuffer() (configurable, default 5000),
// oldest messages dropped first; dropped count is tracked and shown in the
// status bar. Pause stops ingestion entirely (manual, or automatically the
// moment an incoming message matches the active filters).
function pushMessage(msg) {
  handleChatReply(msg);
  if (paused) return;
  if (!msg.id) msg.id = ++nextId;
  messages.push(msg);
  const cap = maxBuffer();
  if (messages.length > cap) {
    const excess = messages.length - cap;
    messages.splice(0, excess);
    droppedCount += excess;
  }

  if (document.getElementById('pause-on-match').checked && matchesCurrentFilters(msg)) {
    setPaused(true);
  }

  render();
}

function matchesCurrentFilters(msg) {
  const fType   = document.getElementById('filter').value.trim();
  const fSearch = document.getElementById('search').value.trim();
  const fSess   = document.getElementById('session_filter').value.trim().toLowerCase();
  const fSrc    = document.getElementById('source_filter').value.trim().toLowerCase();
  const fDst    = document.getElementById('dest_filter').value.trim().toLowerCase();
  // Only auto-pause when at least one filter is actually set — otherwise
  // "pause on filter match" would fire on every single message.
  if (!fType && !fSearch && !fSess && !fSrc && !fDst) return false;
  return globMatch(msg.type, fType) &&
    matchesSearch(msg, fSearch) &&
    (!fSess || String(msg.session||'').toLowerCase().includes(fSess)) &&
    (!fSrc  || String(msg.source||'').toLowerCase().includes(fSrc)) &&
    (!fDst  || String(msg.destination||'').toLowerCase().includes(fDst));
}

function setPaused(value) {
  paused = value;
  const btn = document.getElementById('pause-btn');
  btn.textContent = paused ? '▶ Resume' : '⏸ Pause';
  btn.classList.toggle('pause-active', paused);
}

function togglePause() {
  setPaused(!paused);
}

function clearBuffer() {
  messages = [];
  droppedCount = 0;
  render();
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportJSONL() {
  if (transportMode === 'sse') {
    // Use the server's full capture buffer
    window.location.href = 'api/export';
    return;
  }
  const lines = messages.map(m => JSON.stringify(m)).join('\n');
  download(lines, 'bus_messages.jsonl', 'application/x-ndjson');
}

function exportJSON() {
  download(JSON.stringify(messages, null, 2), 'bus_messages.json', 'application/json');
}

function download(content, filename, mime) {
  const blob = new Blob([content], {type: mime});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// Save this page as a local file: identical functionality with no
// mixed-content restrictions (Safari/older Firefox block ws://localhost
// from https origins; a local file has no such limit).
async function downloadStandalone() {
  try {
    const r = await fetch(window.location.pathname);
    const html = await r.text();
    download(html, 'ovos-busmon.html', 'text/html');
  } catch (e) {
    download(document.documentElement.outerHTML, 'ovos-busmon.html', 'text/html');
  }
}

// ─── Chat panel ───────────────────────────────────────────────────────────────
// One stable Session per browser tab (persisted in sessionStorage so a
// reload keeps the same conversation), reused for every turn so
// converse/multi-turn context on the OVOS side works. Never "default".
function getChatSessionId() {
  const KEY = 'busmon-chat-session-id';
  let id = sessionStorage.getItem(KEY);
  if (!id) {
    id = 'busmon-chat-' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2)));
    sessionStorage.setItem(KEY, id);
  }
  return id;
}

const chatSessionId = getChatSessionId();
document.getElementById('chat-session-id-label').textContent = chatSessionId;

let chatOpen = false;

function toggleChat() {
  chatOpen = !chatOpen;
  const panel = document.getElementById('chat-panel');
  const btn = document.getElementById('chat-btn');
  panel.classList.toggle('open', chatOpen);
  btn.classList.toggle('pause-active', chatOpen);
  if (chatOpen) document.getElementById('chat-input').focus();
}

function appendChatBubble(kind, text) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + kind;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  if (transportMode !== 'sse') {
    appendChatBubble('error', 'Chat requires service (SSE) mode — this page is in direct WebSocket mode.');
    return;
  }
  appendChatBubble('me', text);
  input.value = '';
  try {
    const resp = await fetch('api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({utterance: text, lang: 'en-us', session_id: chatSessionId}),
    });
    if (!resp.ok) {
      appendChatBubble('error', 'Send failed: ' + await resp.text());
    }
  } catch (e) {
    appendChatBubble('error', 'Send failed: ' + e.message);
  }
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});

// Render only the two reply shapes the chat panel understands, and only
// when they belong to *this* browser session — every other bus message
// keeps flowing through the normal log/timeline unaffected.
function handleChatReply(msg) {
  if (msg.session !== chatSessionId) return;
  const t = (msg.type || '').toLowerCase();
  if (t === 'ovos.utterance.speak' || t === 'speak') {
    const utt = (msg.data && msg.data.utterance) || '';
    if (utt) appendChatBubble('assistant', utt);
  } else if (t === 'complete_intent_failure') {
    appendChatBubble('error', 'No response (complete_intent_failure)');
  }
}

// ─── Filter listeners ─────────────────────────────────────────────────────────
['filter','search','session_filter','source_filter','dest_filter','sort']
  .forEach(id => document.getElementById(id).addEventListener('input', render));

// ─── Startup ──────────────────────────────────────────────────────────────────
detectTransport().then((mode) => {
  transportMode = mode;
  if (mode === 'sse') startSSE();
  else startDirectWS();
});
</script>
</body>
</html>
